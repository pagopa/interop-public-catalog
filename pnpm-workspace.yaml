packages:
  - 'packages/*'

catalog:
  '@types/node': 20.19.17
  '@types/pg': 8.15.5
  axios: 1.15.2
  dotenv-flow: 4.1.0
  drizzle-orm: 0.45.2
  pg: 8.16.3
  prettier: 3.6.2
  ts-pattern: 5.2.0
  tsx: 4.19.1
  typescript: 5.9.3
  winston: 3.16.0
  zod: 4.1.12
  zod-validation-error: 5.0.0

# Known, deliberate peer-dependency mismatches. Each entry exists because a
# transitive dependency's peerDependencies range predates a major bump we
# already made on purpose; keep strict-peer-dependencies enabled everywhere
# else so future mismatches like this still fail loudly.
peerDependencyRules:
  allowedVersions:
    # design-react-kit -> reactstrap -> react-popper@2.3.0 declares peer
    # react/react-dom <=18; workspace is on React 19. Scoped to react-popper
    # only, so an unrelated future react-peer mismatch still fails loudly.
    react-popper>react: '19'
    react-popper>react-dom: '19'
    # @strapi/strapi -> @strapi/data-transfer -> typedoc@0.25.10 declares
    # peer typescript 4.6.x-5.3.x; workspace is on typescript 5.9.3. Scoped
    # to typedoc only, so an unrelated future typescript-peer mismatch
    # still fails loudly.
    typedoc>typescript: '5'
